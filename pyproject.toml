[project]
name = "quick-translate"
version = "0.2.1"
description = "Phan mem dich khung chat man hinh va dien nhanh bang Gemini"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7.0",
    "mss>=9.0.1",
    "Pillow>=10.4.0",
    "google-genai>=1.0.0",
    "pynput>=1.7.7",
    "pyperclip>=1.9.0",
]

[project.scripts]
quick-translate = "quick_translate.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quick_translate"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
